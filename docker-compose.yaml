services:
  faiss-service:
    build:
      context: ./retrieval
      dockerfile: ../docker/faiss.Dockerfile
    container_name: tagsynapse_faiss
    environment:
      - TAGSYNAPSE_FAISS_INDEX_PATH=${TAGSYNAPSE_FAISS_INDEX_PATH:-/mnt/faiss_index/artificial_filtered_output_faiss.index}
    volumes:
      # Host side follows TAGSYNAPSE_DATA_DIR (default ./faiss); container side is fixed.
      - "${TAGSYNAPSE_DATA_DIR:-./faiss}/index:/mnt/faiss_index:ro"
    ports:
      - "5000:5000"
    restart: unless-stopped
