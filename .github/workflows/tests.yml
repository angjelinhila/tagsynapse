name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Core deps only: the package and eval never import streamlit or torch,
      # and the app smoke test skips itself when they're absent.
      - run: pip install numpy pandas python-dotenv pytest
      - run: pytest -q
