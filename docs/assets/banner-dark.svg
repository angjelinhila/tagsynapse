<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="TagSynapse - structure without vocabulary homogenization">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
    <radialGradient id="glow" cx="0.32" cy="0.5" r="0.45"><stop offset="0" stop-color="#38bdf8" stop-opacity="0.18"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#glow)"/>
  <!-- folksonomy cluster: loose, amber -->
  <g stroke="#f59e0b" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M80 92 L148 138 L108 196"/><path d="M148 138 L222 108 L292 150 L252 204"/><path d="M222 108 L186 60"/>
  </g>
  <g fill="#f59e0b"><circle cx="80" cy="92" r="7"/><circle cx="148" cy="138" r="10"/><circle cx="108" cy="196" r="6"/><circle cx="222" cy="108" r="8"/><circle cx="292" cy="150" r="9"/><circle cx="252" cy="204" r="6"/><circle cx="186" cy="60" r="5"/></g>
  <!-- bridge: dashed, inferred relations -->
  <g stroke="#a78bfa" stroke-width="2" fill="none" stroke-dasharray="7 6" stroke-linecap="round">
    <path d="M292 150 C 340 140, 350 118, 398 110"/><path d="M222 108 C 300 70, 340 78, 398 82"/><path d="M252 204 C 320 200, 360 180, 440 158"/>
  </g>
  <!-- controlled hierarchy: tree, sky -->
  <g stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.8" fill="none">
    <path d="M398 82 L440 130 L470 186"/><path d="M398 82 L356 130"/><path d="M440 130 L410 186"/><path d="M398 82 L398 110"/>
  </g>
  <g fill="#38bdf8"><circle cx="398" cy="82" r="10"/><circle cx="440" cy="130" r="8"/><circle cx="356" cy="130" r="7"/><circle cx="470" cy="186" r="6"/><circle cx="410" cy="186" r="6"/><circle cx="398" cy="110" r="6"/></g>
  <circle cx="398" cy="82" r="18" fill="none" stroke="#38bdf8" stroke-opacity="0.35" filter="url(#soft)"/>
  <!-- wordmark -->
  <text x="560" y="112" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="60" font-weight="800" letter-spacing="-1.5" fill="#f8fafc">Tag<tspan fill="#38bdf8">Synapse</tspan></text>
  <text x="563" y="152" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" fill="#e2e8f0">Structure without vocabulary homogenization</text>
  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
    <rect x="563" y="178" width="118" height="28" rx="14" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5"/><text x="622" y="197" text-anchor="middle" fill="#fbbf24">folksonomy</text>
    <rect x="691" y="178" width="162" height="28" rx="14" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.5"/><text x="772" y="197" text-anchor="middle" fill="#7dd3fc">controlled vocabulary</text>
    <rect x="863" y="178" width="132" height="28" rx="14" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.5"/><text x="929" y="197" text-anchor="middle" fill="#c4b5fd">typed relations</text>
    <rect x="1005" y="178" width="78" height="28" rx="14" fill="#a78bfa" fill-opacity="0.15" stroke="#a78bfa" stroke-opacity="0.5"/><text x="1044" y="197" text-anchor="middle" fill="#c4b5fd">tag GNN</text>
  </g>
  <text x="563" y="236" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">users organize information through the graph — and their organization changes the graph</text>
</svg>
